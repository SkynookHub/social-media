<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skynook</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>
    
    <main class="container">
        <header class="profile">
            <div class="avatar-container">
                <img src="imagen.webp" alt="Skynook Avatar" class="avatar">
            </div>
            <h1>Skynook</h1>
            <p class="tagline">Artista Visual • Digital Monster Team</p>
            <p class="description">Creando mundos a través de videojuegos, webcomics y narrativa digital.</p>
        </header>

        <section class="links-container">
            <a href="https://cara.app/skynook" target="_blank" class="link-card portfolio">
                <i class="fa-solid fa-palette icon"></i>
                <span>Cara</span>
            </a>
            
            <a href="https://instagram.com/skynook.u" target="_blank" class="link-card">
                <i class="fa-brands fa-instagram icon"></i>
                <span>Instagram</span>
            </a>
        </section>

        <footer>
            <p>Santiago, Chile 🇨🇱</p>
        </footer>
    </main>

    <script src="main.js"></script>
</body>
</html>
